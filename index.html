<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>石のプロフィール帳</title>
<meta name="theme-color" content="#E7E8E3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="石の帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<script src="./html2canvas.min.js" defer></script>
<style>
  :root{
    --page:#E7E8E3; --paper:#FBFAF6; --ink:#25262B; --soft:#6E6F73; --line:#D8D6CE;
    --theme:#C2412D;
    --hand:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:var(--page);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--theme);outline-offset:2px}

  /* shelf */
  .shelf{display:flex;gap:10px;overflow-x:auto;padding:14px 16px 6px;scrollbar-width:none}
  .shelf::-webkit-scrollbar{display:none}
  .thumb{flex:0 0 auto;width:58px;border:none;background:none;padding:0;text-align:center;font-size:11px;color:var(--soft)}
  .thumb img,.thumb .add{display:block;width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid transparent;background:var(--paper)}
  .thumb.on img{border-color:var(--ink)}
  .thumb .add{display:grid;place-items:center;font-size:24px;color:var(--soft);border:1.5px dashed #AFAFA8}
  .thumb span{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .wrap{max-width:440px;margin:0 auto;padding:8px 16px 40px}
  .bar{display:flex;gap:8px;justify-content:flex-end;margin:6px 0 12px}
  .btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:6px 16px;font-size:13px}
  .btn.solid{background:var(--ink);color:var(--paper)}
  .btn.danger{border-color:#A33;color:#A33}

  /* card */
  .card{background:var(--paper);border-radius:6px;padding:22px 22px 18px;position:relative;
    box-shadow:0 1px 0 #CFCDC4, 0 14px 30px -18px rgba(40,38,30,.45);
    background-image:radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px);background-size:4px 4px}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--theme);border-radius:6px 6px 0 0}
  .niche{position:relative;margin:6px auto 0;width:78%;aspect-ratio:4/4.6}
  .niche img{width:100%;height:100%;object-fit:cover;border-radius:999px 999px 10px 10px / 46% 46% 10px 10px;display:block;background:#ddd}
  .bubbles{display:flex;flex-direction:column;gap:8px;margin:14px 4px 0}
  .bubble{position:relative;max-width:82%;width:fit-content;background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:5px 10px 6px;
    font-family:var(--hand);font-size:13px;line-height:1.45}
  .bubble b{font-weight:400;margin-right:3px}
  .bubble.l{align-self:flex-start;transform:rotate(-1.5deg)}
  .bubble.r{align-self:flex-end;transform:rotate(1.5deg)}
  .bubble::before{content:"";position:absolute;top:-7px;width:10px;height:10px;background:var(--paper);border-left:1.5px solid var(--ink);border-top:1.5px solid var(--ink);transform:rotate(45deg)}
  .bubble.l::before{left:22px}
  .bubble.r::before{right:22px}
  .name{font-family:var(--hand);font-weight:600;font-size:30px;text-align:center;margin:22px 0 0;line-height:1.3}
  .kind{text-align:center;color:var(--soft);font-size:12px;margin-top:2px}
  .catch{font-family:var(--hand);font-size:20px;line-height:1.75;text-align:center;margin:18px 0 4px;white-space:pre-wrap;color:var(--theme)}
  .face{text-align:center;font-size:14px;color:var(--soft)}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:16px 0 18px}
  .chip{border:1.5px solid var(--theme);color:var(--theme);padding:2px 10px;font-size:13px;border-radius:3px;font-weight:500}
  .rows{margin:0;padding:0}
  .row{display:grid;grid-template-columns:6.5em 1fr;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line)}
  .row dt{font-size:12px;color:var(--theme);font-weight:700;padding-top:2px}
  .row dd{margin:0;font-size:14px}
  details.msg{margin-top:16px}
  details.msg summary{font-size:13px;color:var(--soft);list-style:none;cursor:pointer}
  details.msg summary::-webkit-details-marker{display:none}
  details.msg summary::before{content:"＋ ";color:var(--theme)}
  details.msg[open] summary::before{content:"－ "}
  .msgbody{font-family:var(--hand);white-space:pre-wrap;font-size:14px;line-height:1.85;border-left:3px solid var(--theme);padding:4px 0 4px 12px;margin-top:8px}
  .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);margin-top:16px}

  /* editor */
  .editor{background:var(--paper);border-radius:6px;padding:18px}
  .editor h2{font-size:16px;margin:0 0 12px}
  .f{display:block;margin-bottom:14px}
  .f > span{display:block;font-size:12px;color:var(--soft);margin-bottom:4px}
  .f input,.f textarea,.f select{width:100%;border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px}
  .f textarea{resize:vertical;min-height:70px;line-height:1.6}
  .pair{display:grid;grid-template-columns:3.2em 1fr 2em;gap:6px;margin-bottom:6px}
  .pair2{display:grid;grid-template-columns:7em 1fr 2em;gap:6px;margin-bottom:6px}
  .pair input,.pair2 input{border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:#fff;width:100%}
  .x{border:none;background:none;color:var(--soft);font-size:18px}
  .mini{border:1px dashed #AFAFA8;background:none;border-radius:6px;padding:4px 10px;font-size:12px;color:var(--soft)}
  .swatches{display:flex;gap:8px}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
  .sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--paper)}
  .photo-edit{display:flex;gap:12px;align-items:center}
  .photo-edit img{width:64px;height:64px;object-fit:cover;border-radius:8px}
  .note{font-size:12px;color:var(--soft);text-align:center;margin-top:12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

const BLANK=()=>({id:"s"+Date.now().toString(36),name:"新しい石",kind:"",theme:"fuji",photo:"",catch:"",face:"",
  abilities:[],companions:[],rows:[{label:"好きなもの",value:""},{label:"置き場所",value:""},{label:"浄化",value:""}],
  message:"",met:"",translated:""});

let cards=[],current=null,editing=null;
let hasStore=(()=>{try{localStorage.setItem("stones:probe","1");localStorage.removeItem("stones:probe");return true}catch(e){return false}})();
const store={
  get:k=>{const v=localStorage.getItem(k);if(v===null)throw new Error("not found");return {key:k,value:v}},
  set:(k,v)=>{localStorage.setItem(k,v);return {key:k,value:v}},
  del:k=>{localStorage.removeItem(k)}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}

async function load(){
  if(hasStore){
    try{
      const idx=store.get("stones:index");
      const ids=JSON.parse(idx.value);
      for(const id of ids){
        try{const r=store.get("stone:"+id);cards.push(JSON.parse(r.value))}catch(e){}
      }
    }catch(e){}
  }
  if(!cards.length){cards=[structuredClone(SEED)];await saveAll()}
  const old=cards.find(c=>c.id==="shishi"&&c.name==="獅子さん");if(old){old.name="ぺんとぷん";await saveCard(old)}
  current=cards[0].id;render();
}
async function saveCard(c){
  if(!hasStore)return true;
  try{store.set("stone:"+c.id,JSON.stringify(c));
      store.set("stones:index",JSON.stringify(cards.map(x=>x.id)));return true}
  catch(e){console.error(e);return false}
}
async function saveAll(){for(const c of cards)await saveCard(c)}

function renderShelf(){
  $("#shelf").innerHTML=cards.map(c=>`<button class="thumb ${c.id===current&&!editing?"on":""}" data-id="${c.id}">
    ${c.photo?`<img src="${c.photo}" alt="">`:`<span class="add" style="border-style:solid">石</span>`}<span>${esc(c.name)}</span></button>`).join("")
    +`<button class="thumb" id="addBtn"><span class="add">＋</span><span>石を追加</span></button>`;
  document.querySelectorAll(".thumb[data-id]").forEach(b=>b.onclick=()=>{current=b.dataset.id;editing=null;render()});
  $("#addBtn").onclick=()=>{editing=BLANK();render()};
}

function bubblesHTML(list){
  const items=list.filter(b=>b.text||b.icon);
  if(!items.length)return "";
  return `<div class="bubbles">${items.map((b,i)=>`<div class="bubble ${i%2?"r":"l"}"><b>${esc(b.icon)}</b>${esc(b.text)}</div>`).join("")}</div>`;
}
function cardHTML(c){
  return `<article class="card" id="card" style="--theme:${THEMES[c.theme]||THEMES.shu}">
    <div class="niche">${c.photo?`<img src="${c.photo}" alt="${esc(c.name)}の写真">`:`<div style="width:100%;height:100%;border-radius:999px 999px 10px 10px / 46% 46% 10px 10px;background:#E2E1DA;display:grid;place-items:center;color:#999">写真なし</div>`}
</div>
    ${bubblesHTML(c.companions)}
    <h1 class="name">${esc(c.name)}</h1>
    ${c.kind?`<div class="kind">${esc(c.kind)}</div>`:""}
    ${c.catch?`<p class="catch">${esc(c.catch)}</p>`:""}
    ${c.face?`<div class="face">${esc(c.face)}</div>`:""}
    ${c.abilities.length?`<div class="chips">${c.abilities.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}</div>`:""}
    <dl class="rows">${c.rows.filter(r=>r.label||r.value).map(r=>`<div class="row"><dt>${esc(r.label)}</dt><dd>${esc(r.value)}</dd></div>`).join("")}</dl>
    ${c.message?`<details class="msg" id="msg"><summary>通訳メッセージ全文</summary><div class="msgbody">${esc(c.message)}</div></details>`:""}
    ${(c.met||c.translated)?`<div class="foot"><span>${c.met?"迎えた日 "+esc(c.met):""}</span><span>${c.translated?"通訳 "+esc(c.translated):""}</span></div>`:""}
  </article>`;
}

function render(){
  renderShelf();
  if(editing){renderEditor();return}
  const c=cards.find(x=>x.id===current);
  $("#main").innerHTML=`<div class="bar"><button class="btn" id="imgBtn">画像で保存</button><button class="btn solid" id="editBtn">編集</button></div>
    ${cardHTML(c)}${hasStore?`<p class="note">この端末に自動保存されます。機種変更に備えて、ときどき「バックアップ」を控えておくと安心です。</p>`:`<p class="note">このブラウザでは保存が使えません。プライベートモードを解除するか、「バックアップ」で内容を控えてください。</p>`}<div class="bar" style="justify-content:center;margin-top:14px;flex-wrap:wrap"><button class="btn" id="exBtn">iCloudに書き出す</button><label class="btn">iCloudから読み込む<input type="file" accept=".json,application/json" id="fileIn" hidden></label></div><p class="note"><button class="x" style="font-size:12px;text-decoration:underline" id="bkBtn">文字でバックアップ</button><button class="x" style="font-size:12px;text-decoration:underline" id="inBtn">文字から読み込む</button></p>`;
  $("#editBtn").onclick=()=>{editing=structuredClone(c);render()};
  $("#imgBtn").onclick=saveImage;
  $("#bkBtn").onclick=showBackup;
  $("#inBtn").onclick=showImport;
  $("#exBtn").onclick=exportFile;
  $("#fileIn").onchange=ev=>{const f=ev.target.files[0];if(f)importFile(f)};
}
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`}
async function exportFile(){
  const json=JSON.stringify({v:1,saved:new Date().toISOString(),cards},null,1);
  const name=`stone-cards-${stamp()}.json`;
  const file=new File([json],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});toast("「ファイルに保存」からiCloud Driveを選んでください");return}
    catch(e){if(e.name==="AbortError")return}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("書き出しました");
}
function importFile(f){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);if(!Array.isArray(d.cards)||!d.cards.length)throw 0;
      if(!confirm(`${d.cards.length}枚のカードを読み込みます。同じ石のカードは読み込んだ内容で上書きされます。`))return;
      for(const c of d.cards){const i=cards.findIndex(x=>x.id===c.id);if(i>=0)cards[i]=c;else cards.push(c)}
      current=d.cards[0].id;editing=null;await saveAll();render();toast("読み込みました");
    }catch(e){toast("読み込めませんでした。書き出したjsonファイルを選んでください")}
  };
  r.readAsText(f);
}
function showBackup(){
  const data=JSON.stringify({v:1,cards});
  $("#main").innerHTML=`<div class="editor"><h2>バックアップ</h2><p class="note" style="text-align:left">下の文字をすべてコピーして、メモアプリなどに保存してください。写真も含まれています。</p><label class="f"><textarea id="bk" readonly style="min-height:200px;font-size:11px">${esc(data)}</textarea></label><div class="bar"><button class="btn" id="back">戻る</button><button class="btn solid" id="copy">コピー</button></div></div>`;
  $("#back").onclick=render;
  $("#copy").onclick=async()=>{const t=$("#bk");t.select();try{await navigator.clipboard.writeText(t.value);toast("コピーしました")}catch(e){document.execCommand("copy");toast("コピーしました")}};
}
function showImport(){
  $("#main").innerHTML=`<div class="editor"><h2>読み込む</h2><p class="note" style="text-align:left">保存しておいたバックアップの文字を貼り付けてください。今のカードは置き換わります。</p><label class="f"><textarea id="im" style="min-height:200px;font-size:11px"></textarea></label><div class="bar"><button class="btn" id="back">戻る</button><button class="btn solid" id="doIm">読み込む</button></div></div>`;
  $("#back").onclick=render;
  $("#doIm").onclick=async()=>{try{const d=JSON.parse($("#im").value.trim());if(!Array.isArray(d.cards)||!d.cards.length)throw 0;cards=d.cards;current=cards[0].id;editing=null;await saveAll();render();toast("読み込みました")}catch(e){toast("読み込めませんでした。バックアップの文字を全部貼り付けてください")}};
}

async function saveImage(){
  if(typeof html2canvas==="undefined"){toast("画像機能を読み込み中です。少し待ってから試してください");return}
  const msg=$("#msg");const wasOpen=msg&&msg.open;if(msg)msg.open=true;
  const name=(cards.find(x=>x.id===current).name||"stone");
  try{
    const canvas=await html2canvas($("#card"),{backgroundColor:"#E7E8E3",scale:2});
    if(msg)msg.open=wasOpen;
    const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
    const file=new File([blob],name+".png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==="AbortError")return}
    }
    showImage(canvas.toDataURL("image/png"));
  }catch(e){if(msg)msg.open=wasOpen;toast("画像を作れませんでした。スクリーンショットで保存してください")}
}
function showImage(url){
  $("#main").innerHTML=`<div class="bar"><button class="btn" id="back">戻る</button></div><img src="${url}" alt="カード画像" style="width:100%;border-radius:6px;display:block"><p class="note">画像を長押しして「写真に保存」してください</p>`;
  $("#back").onclick=render;
}

function renderEditor(){
  const e=editing;const isNew=!cards.some(c=>c.id===e.id);
  $("#main").innerHTML=`<div class="editor">
    <h2>${isNew?"石を追加":"プロフィールを編集"}</h2>
    <div class="f"><span>写真</span><div class="photo-edit">
      ${e.photo?`<img src="${e.photo}" alt="">`:""}<label class="btn">写真を選ぶ<input type="file" accept="image/*" id="photoIn" hidden></label></div></div>
    <label class="f"><span>名前</span><input id="name" value="${esc(e.name)}"></label>
    <label class="f"><span>石の種類・形</span><input id="kind" value="${esc(e.kind)}" placeholder="例：パイライト / ふくろう"></label>
    <div class="f"><span>カードの色</span><div class="swatches">${Object.entries(THEMES).map(([k,v])=>`<button class="sw ${e.theme===k?"on":""}" data-k="${k}" style="background:${v}" aria-label="${k}"></button>`).join("")}</div></div>
    <label class="f"><span>ひとこと(大きく表示)</span><textarea id="catch">${esc(e.catch)}</textarea></label>
    <label class="f"><span>顔文字</span><input id="face" value="${esc(e.face)}"></label>
    <label class="f"><span>できること(読点か改行で区切る)</span><textarea id="abil">${esc(e.abilities.join("、"))}</textarea></label>
    <div class="f"><span>一緒にいる子のひとこと(写真の下に表示)</span><div id="comps"></div><button class="mini" id="addComp">＋ 追加</button></div>
    <div class="f"><span>プロフィール項目</span><div id="rows"></div><button class="mini" id="addRow">＋ 項目を追加</button></div>
    <label class="f"><span>通訳メッセージ全文</span><textarea id="message" style="min-height:160px">${esc(e.message)}</textarea></label>
    <label class="f"><span>迎えた日</span><input id="met" value="${esc(e.met)}" placeholder="例：2026年9月"></label>
    <label class="f"><span>通訳してもらった日</span><input id="translated" value="${esc(e.translated)}"></label>
    <div class="bar" style="justify-content:space-between">
      ${isNew?"<span></span>":`<button class="btn danger" id="delBtn">削除</button>`}
      <span style="display:flex;gap:8px"><button class="btn" id="cancelBtn">やめる</button><button class="btn solid" id="saveBtn">保存</button></span>
    </div></div>`;
  drawLists();
  document.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{sync();e.theme=b.dataset.k;renderEditor()});
  $("#photoIn").onchange=ev=>{const f=ev.target.files[0];if(f)resizeImage(f).then(d=>{sync();e.photo=d;renderEditor()})};
  $("#addComp").onclick=()=>{sync();e.companions.push({icon:"✨",text:""});drawLists()};
  $("#addRow").onclick=()=>{sync();e.rows.push({label:"",value:""});drawLists()};
  $("#cancelBtn").onclick=()=>{editing=null;render()};
  $("#saveBtn").onclick=async()=>{sync();
    const i=cards.findIndex(c=>c.id===e.id);if(i>=0)cards[i]=e;else cards.push(e);
    current=e.id;editing=null;const ok=await saveCard(e);render();toast(!hasStore?"反映しました。バックアップで控えておいてください":ok?"保存しました":"容量がいっぱいで保存できませんでした。写真を小さくするか、石を減らしてください")};
  if(!isNew)$("#delBtn").onclick=async()=>{
    if(!confirm(`「${e.name}」のカードを削除しますか？`))return;
    cards=cards.filter(c=>c.id!==e.id);
    if(hasStore){try{store.del("stone:"+e.id);store.set("stones:index",JSON.stringify(cards.map(x=>x.id)))}catch(_){}}
    if(!cards.length){cards=[BLANK()];await saveAll()}
    current=cards[0].id;editing=null;render();toast("削除しました")};
}
function drawLists(){
  const e=editing;
  $("#comps").innerHTML=e.companions.map((c,i)=>`<div class="pair"><input data-ci="${i}" data-f="icon" value="${esc(c.icon)}" aria-label="絵文字"><input data-ci="${i}" data-f="text" value="${esc(c.text)}" aria-label="ひとこと"><button class="x" data-dc="${i}" aria-label="削除">×</button></div>`).join("");
  $("#rows").innerHTML=e.rows.map((r,i)=>`<div class="pair2"><input data-ri="${i}" data-f="label" value="${esc(r.label)}" placeholder="項目名"><input data-ri="${i}" data-f="value" value="${esc(r.value)}" placeholder="内容"><button class="x" data-dr="${i}" aria-label="削除">×</button></div>`).join("");
  document.querySelectorAll("[data-dc]").forEach(b=>b.onclick=()=>{sync();e.companions.splice(+b.dataset.dc,1);drawLists()});
  document.querySelectorAll("[data-dr]").forEach(b=>b.onclick=()=>{sync();e.rows.splice(+b.dataset.dr,1);drawLists()});
}
function sync(){
  const e=editing;if(!e||!$("#name"))return;
  ["name","kind","catch","face","message","met","translated"].forEach(k=>e[k]=$("#"+k).value);
  e.abilities=$("#abil").value.split(/[、,，\n]/).map(s=>s.trim()).filter(Boolean);
  document.querySelectorAll("[data-ci]").forEach(inp=>e.companions[+inp.dataset.ci][inp.dataset.f]=inp.value);
  document.querySelectorAll("[data-ri]").forEach(inp=>e.rows[+inp.dataset.ri][inp.dataset.f]=inp.value);
}
function resizeImage(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const max=700,s=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");
    cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    res(cv.toDataURL("image/jpeg",.82))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
}
load();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body>
</html>
